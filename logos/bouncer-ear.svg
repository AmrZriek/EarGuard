<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="b_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="b_ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC0"/>
      <stop offset="100%" stop-color="#F5A870"/>
    </linearGradient>
    <linearGradient id="b_suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="b_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="b_rope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="96" fill="url(#b_bg)" />

  <!-- VIP Overhead Blue Spotlight -->
  <polygon points="210,0 100,512 340,512" fill="#3B82F6" opacity="0.07" />

  <!-- 1. The Bouncer Ear (Solid, Centered) -->
  <path d="M 210 60 
           C 130 60, 95 130, 95 210 
           C 95 300, 135 350, 195 365 
           L 195 400 L 265 400 L 265 365 
           C 285 345, 295 320, 295 280 
           C 295 240, 265 215, 265 175 
           C 265 120, 300 80, 245 60 
           Z" 
        fill="url(#b_ear)" 
        stroke="#C2410C" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Ear Inner Cartilage -->
  <path d="M 175 120 C 135 150, 130 220, 165 250" fill="none" stroke="#FB923C" stroke-width="8" stroke-linecap="round" />

  <!-- 2. Dark Aviator Sunglasses (Classic Tough Bouncer Shades) -->
  <g transform="translate(0, 0)">
    <!-- Left Lens -->
    <path d="M 135 160 Q 175 160 185 175 Q 185 205 145 205 Q 125 190 135 160 Z" fill="#09090B" stroke="#52525B" stroke-width="3" />
    <!-- Right Lens -->
    <path d="M 195 160 Q 235 160 245 175 Q 245 205 205 205 Q 185 190 195 160 Z" fill="#09090B" stroke="#52525B" stroke-width="3" />
    <!-- Bridge -->
    <rect x="180" y="165" width="20" height="4" rx="2" fill="#52525B" />
    <!-- White Glare Lines -->
    <line x1="145" y1="168" x2="175" y2="198" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <line x1="205" y1="168" x2="235" y2="198" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- Tough Bouncer Mouth -->
  <path d="M 175 255 L 210 250" stroke="#7C2D12" stroke-width="5" stroke-linecap="round" />

  <!-- Security Radio Coiled Wire on earlobe -->
  <path d="M 255 220 Q 265 230 255 240 Q 245 250 255 260 L 245 300" fill="none" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
  <circle cx="255" cy="220" r="5" fill="#CBD5E1" />

  <!-- 3. Bouncer Tuxedo / Suit & Crossed Forearms (Centered) -->
  <path d="M 80 440 L 80 400 L 140 375 L 205 405 L 270 375 L 330 400 L 330 440 Z" fill="url(#b_suit)" stroke="#18181B" stroke-width="6" />
  <!-- White Shirt & Tie -->
  <polygon points="190,390 205,410 220,390" fill="#FFFFFF" />
  <polygon points="201,405 209,405 212,440 198,440" fill="#09090B" />
  <!-- Crossed Arms -->
  <rect x="105" y="415" width="200" height="42" rx="21" fill="#27272A" stroke="#09090B" stroke-width="6" />
  <!-- Gold Security Badge on chest -->
  <rect x="120" y="423" width="36" height="24" rx="4" fill="#EAB308" stroke="#713F12" stroke-width="2"/>
  <text x="138" y="439" fill="#713F12" font-family="Segoe UI, sans-serif" font-weight="900" font-size="10" text-anchor="middle">GUARD</text>

  <!-- 4. The Velvet Rope & Golden Stanchion (Mounted on Right) -->
  <!-- Stanchion Base -->
  <ellipse cx="430" cy="460" rx="45" ry="14" fill="url(#b_gold)" stroke="#713F12" stroke-width="3"/>
  <!-- Stanchion Post -->
  <rect x="420" y="210" width="20" height="250" rx="4" fill="url(#b_gold)" stroke="#713F12" stroke-width="3"/>
  <!-- Stanchion Ball & Ring -->
  <circle cx="430" cy="200" r="20" fill="url(#b_gold)" stroke="#713F12" stroke-width="3"/>
  <circle cx="430" cy="225" r="8" fill="none" stroke="url(#b_gold)" stroke-width="4"/>

  <!-- Mini Stanchion Ring on Left (anchoring the other side of rope) -->
  <circle cx="280" cy="335" r="8" fill="none" stroke="url(#b_gold)" stroke-width="4"/>

  <!-- Velvet Rope draped between both rings -->
  <path d="M 280 335 Q 355 385 430 225" fill="none" stroke="url(#b_rope)" stroke-width="18" stroke-linecap="round"/>
  <!-- Velvet Rope Gold Clips at both ends -->
  <rect x="274" y="328" width="12" height="14" rx="3" fill="url(#b_gold)" />
  <rect x="422" y="218" width="16" height="14" rx="3" fill="url(#b_gold)" />

  <!-- 5. Mounted Sign on Stanchion Post: "100% SPIKE: DENIED" -->
  <g transform="translate(315, 90)">
    <!-- Mounting Bracket from stanchion ball to sign -->
    <line x1="95" y1="110" x2="115" y2="110" stroke="url(#b_gold)" stroke-width="6" stroke-linecap="round"/>
    <!-- Signboard -->
    <rect x="0" y="0" width="160" height="65" rx="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="4"/>
    <text x="80" y="26" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">100% SPIKE</text>
    <line x1="20" y1="33" x2="140" y2="33" stroke="#991B1B" stroke-width="2"/>
    <text x="80" y="53" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">NOT ON LIST ⛔</text>
  </g>
</svg>
